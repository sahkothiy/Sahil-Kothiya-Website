<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic-Tac-Toe Game</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <div class="winner" role="status" aria-live="polite">
        <div class="winner-box">
          <h2 class="winner-text">Winner: X</h2>
          <button class="newBtn">New Game</button>
        </div>
      </div>
      <div class="draw" role="status" aria-live="polite">
        <div class="draw-box">
          <h2 class="draw-text">It is a Draw</h2>
          <button class="newBtn">New Game</button>
        </div>
      </div>
      <h1>Tic Tac Toe</h1>
      <div class="container">
        <div>
          <button class="box" aria-label="Top left"></button>
          <button class="box" aria-label="Top center"></button>
          <button class="box" aria-label="Top right"></button>
          <button class="box" aria-label="Middle left"></button>
          <button class="box" aria-label="Middle center"></button>
          <button class="box" aria-label="Middle right"></button>
          <button class="box" aria-label="Bottom left"></button>
          <button class="box" aria-label="Bottom center"></button>
          <button class="box" aria-label="Bottom right"></button>
        </div>
        <button id="resetBtn">Reset Game</button>
      </div>
    </main>
    <script src="app.js"></script>
  </body>
</html>
